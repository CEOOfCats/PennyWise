<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pennywise — Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="Auth_Page">
        <h1>Pennywise</h1>

        <!-- LOGIN -->
        <form id="Login_Form">
            <legend>Log In</legend>

            <label for="Login_Username">Username</label>
            <input type="text" id="Login_Username" required> <br>

            <label for="Login_Password">Password</label>
            <div class="password-field">
                <input type="password" id="Login_Password" required>
                <button type="button" class="toggle-password" onclick="togglePassword('Login_Password', 'Login_Password_Toggle_Img')"><img id="Login_Password_Toggle_Img" src="open.png" width="15" height="15" alt="Show"></button>
            </div>
            <br>

            <button type="submit">Log In</button>

            <p class="switch-text">Don't have an account? <a href="#" onclick="showRegister()">Register</a></p>
        </form>

        <!-- REGISTER -->
        <form id="Register_Form" style="display: none;">
            <legend>Register</legend>

            <label for="Register_Username">Username</label>
            <input type="text" id="Register_Username" required> <br>

            <label for="Register_Password">Password</label>
            <div class="password-field">
                <input type="password" id="Register_Password" required minlength="8">
                <button type="button" class="toggle-password" onclick="togglePassword('Register_Password','Register_Password_Toggle_Img')"><img id="Register_Password_Toggle_Img" src="open.png" width="15" height="15" alt="Show"></button>
            </div>
            <br>

            <button type="submit">Register</button>

            <p class="switch-text">Already have an account? <a href="#" onclick="showLogin()">Log In</a></p>
        </form>

        <p id="Auth_Error" class="error-text"></p>
    </div>

    <script src="auth.js"></script>
</body>
</html>
