<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PennyWise - Expenses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="mobile-header">
    <h2 style="color:var(--primary)">PennyWise</h2>
    <button class="menu-toggle" onclick="toggleSidebar()">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>PennyWise</h2>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          Dashboard
        </a>
        <a href="expenses.html" class="nav-item active">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
          Expenses
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-item" onclick="logout()" style="color:var(--danger)">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Logout
        </button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px">
        <div>
          <h1>Expenses</h1>
          <p>Manage and track all your spending</p>
        </div>
        <button class="btn btn-primary" onclick="openModal('Add Expense')">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          Add Expense
        </button>
      </div>

      <div class="card mb-4">
        <div class="card-body">
          <div class="filter-bar">
            <div class="filter-group">
              <label>Search</label>
              <input type="text" id="searchInput" class="filter-input" placeholder="Search description or category...">
            </div>
            <div class="filter-group">
              <label>Category</label>
              <input type="text" id="filterCategory" class="filter-input" placeholder="Filter by category">
            </div>
            <div class="filter-group">
              <label>Min Price</label>
              <input type="number" id="filterMinPrice" class="filter-input" step="0.01" placeholder="$0.00">
            </div>
            <div class="filter-group">
              <label>Max Price</label>
              <input type="number" id="filterMaxPrice" class="filter-input" step="0.01" placeholder="$9999">
            </div>
            <div class="filter-group">
              <label>From</label>
              <input type="date" id="filterStart" class="filter-input">
            </div>
            <div class="filter-group">
              <label>To</label>
              <input type="date" id="filterEnd" class="filter-input">
            </div>
            <div class="filter-group">
              <label>Sort By</label>
              <select id="sortBy" class="filter-input">
                <option value="">Default</option>
                <option value="price">Price</option>
                <option value="category">Category</option>
                <option value="date">Date</option>
                <option value="amount">Amount</option>
              </select>
            </div>
            <div class="filter-group">
              <label>Order</label>
              <select id="sortOrder" class="filter-input">
                <option value="asc">Ascending</option>
                <option value="desc">Descending</option>
              </select>
            </div>
            <div style="display:flex;gap:8px">
              <button class="btn btn-primary" id="applyFilters" style="height:42px;padding:0 20px">Apply</button>
              <button class="btn btn-secondary" id="clearFilters" style="height:42px;padding:0 16px">Clear</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div>
            <h3 class="card-title">All Expenses</h3>
            <p style="font-size:0.85rem;color:var(--text-secondary);margin-top:2px" id="resultCount">0 results</p>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <div style="text-align:right;margin-right:12px">
              <div style="font-size:0.75rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px">Total</div>
              <div style="font-weight:700;font-size:1.1rem" id="filteredTotal">$0.00</div>
            </div>
            <div style="text-align:right;margin-right:12px">
              <div style="font-size:0.75rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px">Items</div>
              <div style="font-weight:700;font-size:1.1rem" id="filteredCount">0</div>
            </div>
            <button class="btn btn-sm btn-secondary" id="exportBtn">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              Export CSV
            </button>
          </div>
        </div>
        <div style="padding:0">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Category</th>
                  <th>Description</th>
                  <th>Date</th>
                  <th>Qty × Price</th>
                  <th class="text-right">Total</th>
                  <th style="width:100px">Actions</th>
                </tr>
              </thead>
              <tbody id="expensesTable">
                <tr><td colspan="6" style="text-align:center;padding:40px"><div class="spinner" style="width:32px;height:32px;margin:0 auto"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="expenseModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Add Expense</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="expenseForm">
        <div class="modal-body">
          <input type="hidden" id="expenseId">
          <div class="form-group">
            <label>Amount (Quantity)</label>
            <input type="number" id="fAmount" class="form-input" min="1" required>
          </div>
          <div class="form-group">
            <label>Unit Price</label>
            <input type="number" id="fPrice" class="form-input" step="0.01" min="0" required>
          </div>
          <div class="form-group">
            <label>Category</label>
            <input type="text" id="fCategory" class="form-input" required placeholder="e.g. Groceries">
          </div>
          <div class="form-group">
            <label>Description</label>
            <input type="text" id="fDesc" class="form-input" required placeholder="What did you buy?">
          </div>
          <div class="form-group">
            <label>Purchase Date</label>
            <input type="date" id="fDate" class="form-input" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Expense</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/expenses.js"></script>
</body>
</html>
